name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adobe-addon:
    name: Adobe add-on build and adapter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/adobe-express/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: integrations/adobe-express
      - run: npm test
        working-directory: integrations/adobe-express

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.1"
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.1"
          args: format --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # skia-python needs the same GL runtime libs the Dockerfile installs.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libegl1 libglib2.0-0
      - run: pip install -r requirements-dev.txt
      - run: pytest

  docker:
    # Scoring runs the Docker image, so an image that doesn't build is a
    # broken submission even if the tests pass.
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: chameleon-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install host schema validator
        run: python3 -m pip install "jsonschema==4.26.0"
      # Verify the same image offline, with real JSON/PNG pairs and strict
      # schema, contract, packaged-file and native-render checks.
      - name: Verify offline sample contracts and native renders
        run: |
          python3 -m tools.verify_docker --skip-build \
            --image chameleon-engine:ci --out output/docker-ci
      - name: Retain offline verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-offline-verification
          path: output/docker-ci
          if-no-files-found: ignore
