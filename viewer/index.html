<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chameleon Viewer</title>
<style>
  :root { --bg: #f4f0ea; --ink: #1c1018; --muted: #6b5f66; --line: #d8d0c6; --text: #2b6cb0; --image: #b7791f; --shape: #2f855a; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; gap: 16px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  label input[type=file] { max-width: 220px; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background: white; border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-height: 200px; }
  section h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  canvas { width: 100%; height: auto; background: #fff; border: 1px solid var(--line); }
  #inspector { grid-column: 1 / -1; font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; color: var(--muted); }
  .legend { display: flex; gap: 12px; margin-left: auto; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 4px; border: 2px solid; vertical-align: -1px; }
</style>
</head>
<body>
<header>
  <h1>Chameleon Viewer</h1>
  <label>task JSON <input id="task" type="file" accept=".json"></label>
  <label>output JSON <input id="output" type="file" accept=".json"></label>
  <label>output PNG <input id="png" type="file" accept=".png"></label>
  <label><input id="showText" type="checkbox" checked> draw text</label>
  <span class="legend">
    <span><i style="border-color: var(--text)"></i>text</span>
    <span><i style="border-color: var(--image)"></i>image</span>
    <span><i style="border-color: var(--shape)"></i>shape</span>
  </span>
</header>
<main>
  <section><h2 id="srcTitle">Source</h2><canvas id="src"></canvas></section>
  <section><h2 id="outTitle">Output</h2><canvas id="out"></canvas></section>
  <section id="inspector">Load a task JSON from input/ and the matching *_output.json from output/. Hover an element for its properties. Drop a rendered PNG to see it under the output boxes.</section>
</main>
<script>
(() => {
  const COLORS = { text: "#2b6cb0", image: "#b7791f", shape: "#2f855a" };
  const state = { source: null, output: null, png: null };
  const $ = (id) => document.getElementById(id);

  const readJSON = (file) => file.text().then(JSON.parse);
  const readImage = (file) => new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.src = URL.createObjectURL(file);
  });

  $("task").addEventListener("change", async (e) => {
    const doc = await readJSON(e.target.files[0]);
    state.source = doc.source || doc;
    state.target = doc.target_canvas || null;
    draw();
  });
  $("output").addEventListener("change", async (e) => { state.output = await readJSON(e.target.files[0]); draw(); });
  $("png").addEventListener("change", async (e) => { state.png = await readImage(e.target.files[0]); draw(); });
  $("showText").addEventListener("change", draw);

  function drawDesign(canvasEl, design, title, bitmap) {
    if (!design) return;
    const { width, height } = design.canvas;
    const scale = Math.min(1, 900 / Math.max(width, height));
    canvasEl.width = Math.round(width * scale);
    canvasEl.height = Math.round(height * scale);
    const ctx = canvasEl.getContext("2d");
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, width, height);
    if (bitmap) ctx.drawImage(bitmap, 0, 0, width, height);
    const els = [...design.elements].sort((a, b) => (a.z_index ?? 0) - (b.z_index ?? 0));
    const drawText = $("showText").checked;
    for (const el of els) {
      ctx.save();
      ctx.globalAlpha = el.opacity ?? 1;
      ctx.translate(el.x + el.width / 2, el.y + el.height / 2);
      ctx.rotate(((el.rotation ?? 0) * Math.PI) / 180);
      ctx.translate(-el.width / 2, -el.height / 2);
      if (el.type === "shape" && !bitmap) {
        ctx.fillStyle = el.fill_color || "rgba(0,0,0,0.1)";
        if (el.shape_type === "ellipse") {
          ctx.beginPath(); ctx.ellipse(el.width / 2, el.height / 2, el.width / 2, el.height / 2, 0, 0, Math.PI * 2); ctx.fill();
        } else { ctx.fillRect(0, 0, el.width, el.height); }
      }
      if (el.type === "text" && drawText && !bitmap) {
        ctx.fillStyle = el.color || "#000";
        ctx.font = `${el.font_weight === "bold" ? "bold " : ""}${el.font_style === "italic" ? "italic " : ""}${el.font_size}px ${/serif/i.test(el.font_family) ? "Georgia, serif" : "Helvetica, Arial, sans-serif"}`;
        ctx.textAlign = el.text_align || "left";
        const x = el.text_align === "center" ? el.width / 2 : el.text_align === "right" ? el.width : 0;
        wrap(ctx, el.content, el.width).forEach((line, i) => ctx.fillText(line, x, el.font_size * (0.85 + i * (el.line_height ?? 1.2))));
      }
      ctx.globalAlpha = 1;
      ctx.strokeStyle = COLORS[el.type] || "#555";
      ctx.lineWidth = 2 / scale;
      ctx.strokeRect(0, 0, el.width, el.height);
      ctx.fillStyle = COLORS[el.type] || "#555";
      ctx.font = `${12 / scale}px ui-monospace, monospace`;
      ctx.textAlign = "left";
      ctx.fillText(el.id, 2 / scale, 12 / scale);
      ctx.restore();
    }
    canvasEl.onmousemove = (ev) => {
      const r = canvasEl.getBoundingClientRect();
      const px = ((ev.clientX - r.left) / r.width) * width;
      const py = ((ev.clientY - r.top) / r.height) * height;
      const hit = [...els].reverse().find((el) => px >= el.x && px <= el.x + el.width && py >= el.y && py <= el.y + el.height);
      $("inspector").textContent = hit ? `${title}: ${JSON.stringify(hit, null, 1)}` : "";
    };
    return `${title} ${width}×${height}`;
  }

  function wrap(ctx, text, maxWidth) {
    const lines = [];
    for (const para of String(text).split("\n")) {
      let line = "";
      for (const word of para.split(" ")) {
        const probe = line ? `${line} ${word}` : word;
        if (ctx.measureText(probe).width > maxWidth && line) { lines.push(line); line = word; } else { line = probe; }
      }
      lines.push(line);
    }
    return lines;
  }

  function draw() {
    const t = state.target ? ` → target ${state.target.width}×${state.target.height}` : "";
    $("srcTitle").textContent = (drawDesign($("src"), state.source, "Source") || "Source") + t;
    $("outTitle").textContent = drawDesign($("out"), state.output, "Output", state.png) || "Output";
  }
})();
</script>
</body>
</html>
